ss first; money follows.']];

function planner(){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),dim=new Date(y,m+1,0).getDate();let left=0,tot=0;
  for(let d=1;d<=dim;d++){const w=new Date(y,m,d).getDay();if(w>0&&w<6){tot++;if(d>=n.getDate())left++}}
  const wd=n.getDay(),wleft=wd===0||wd===6?0:6-wd,g=guard(),mp=sumP(T.filter(t=>t.date.startsWith(today().slice(0,7)))),out=[];
  if(S.goal>0){const rem=S.goal-mp,exp=S.goal*(tot-left)/Math.max(tot,1);
    out.push(rem<=0?L('Monthly target pura! Ab capital protect mode: risk aadha karo, sirf A+ setup.','Monthly target achieved! Capital-protect mode: halve risk, A+ setups only.'):L(`Monthly goal ke liye ${money(rem)} baaki. Bache ${left} trading din mein roz ~${money(rem/Math.max(left,1))} chahiye.`,`${money(rem)} left for the monthly goal. About ${money(rem/Math.max(left,1))} per day over the remaining ${left} trading days.`));

function htmlRows(h){

<button class="btn" id="lc">${f('Lot nikalo','Calculate lot')}</button><div class="k" id="l-out" style="margin-top:12px;white-space:pre-line;font-size:16px"></div>
<div class="note">${f('Gold: 1 lot = 100 oz. Forex: 1 lot = 100,000 units. Aap tay karo: distance se ya price se. Index aur crypto ka contract size broker ke hisaab se alag ho sakta hai.','Gold: 1 lot = 100 oz. Forex: 1 lot = 100,000 units. You choose distance or prices. Index and crypto contract sizes vary by broker.')}</div></div>
<div class="card"><div class="eb">AI Coach</div><label>Provider</label><select id="s-ai">${Object.entries(AIP).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select><div class="sub" id="s-link" style="margin-top:6px"></div>
<label>API key</label><input id="s-key" type="password" autocomplete="off"><label>Model</label><select id="s-mdl"></select><input id="s-cm" placeholder="${f('Model ka naam likho','Type model name')}" style="display:none;margin-top:8px">
<label>${f('Har trade save ke baad AI review','AI review after every saved trade')}</label><select id="s-auto"><option value="">${f('Band','Off')}</option><option value="1">${f('Chalu','On')}</option></select>
<div class="note">${f('Key sirf aapke device mein save hoti hai, backup mein nahi jaati. Free tier ki limits provider badalte rehte hain. Model ka naam error de toh provider ki site se naya naam daalo.','The key is stored only on your device and is not included in backups. Free-tier limits change; if a model name errors, copy a current one from the provider site.')}</div></div>
<div class="card"><div class="eb">${f('MT5 import','MT5 import')}</div><div class="sub" style="margin-top:6px">${f('MT5 mein History tab, right click, Report, HTML (ya CSV) save karo. File yahan choose karo, ya report ka text neeche paste karo.','In MT5 open the History tab, right click, Report, save as HTML (or CSV). Choose the file here or paste the report text below.')}</div>
<label>${f('Broker server time (UTC se kitna aage)','Broker server time (hours ahead of UTC)')}</label><input type="number" step="1" data-s="off" value="${S.off}"><div class="note" style="margin-top:4px">${f('Import ke trades ka session isi se nikalta hai. MT5 mein Market Watch ka time dekh kar tay karo (aam taur par +2 ya +3).','Used to work out the session of imported trades. Check the time in MT5 Market Watch (usually +2 or +3).')}</div>
<input type="file" id="imp" accept=".html,.htm,.csv,.txt" style="margin-top:10px"><label>${f('Ya yahan paste karo','Or paste here')}</label><textarea id="imp-text" rows="3"></textarea><button class="btn ghost" id="imp-go">${f('Paste kiya hua import karo','Import pasted text')}</button><div class="sub" id="imsg" style="margin-top:8px"></div></div>
<div class="card"><div class="eb">Storage</div><div class="sub" id="st-info" style="margin-top:8px;line-height:1.7"></div><div class="bar"><i id="st-bar" style="width:0%"></i></div>
<div class="grid"><div><label>${f('Itne din se purane','Older than (days)')}</label><input id="pg-days" type="number" value="365"></div><div style="display:flex;align-items:flex-end"><button class="btn ghost" id="purge" style="margin-top:0">${f('Purane delete','Delete old')}</button></div></div>
<div class="note">${f('Trades text mein save hote hain (bahut halke). Screenshots alag jagah compress hoke (~100-200 KB) save hote hain. Pehle Backup lo, phir purane trades hatao.','Trades are stored as light text. Screenshots are compressed (~100-200 KB each) and stored separately. Back up first, then delete old trades.')}</div></div>
<div class="card"><div class="eb">Backup</div><button class="btn" id="exp">${f('Backup banao / share karo','Create / share backup')}</button><textarea id="bk-text" rows="3" style="display:none;margin-top:10px" placeholder="Backup"></textarea>
<div style="display:flex;gap:8px"><button class="btn ghost" id="csv">CSV</button><button class="btn ghost" id="bk-copy">${f('Copy','Copy')}</button><button class="btn ghost" id="bk-rest">${f('Is text se restore','Restore from text')}</button></div>
<label>${f('Backup file se restore','Restore from file')}</label><input type="file" id="rst" accept=".json,.txt"><div class="sub" id="bmsg" style="margin-top:6px"></div>
<button class="btn ghost" id="clr">${f('Saara data delete','Delete all data')}</button><div class="note">${f('Yeh app sirf aapke trade data ka analysis karta hai. Yeh financial advice ya trading signal nahi hai.','This app only analyses your own trade data. It is not financial advice or a trading signal.')}</div></div></section><div id="ov" class="ov"></div>`;
  $('#nav').innerHTML=NAV.map(n=>`<button data-v="${n[0]}" class="${n[0]===TAB?'on':''}"><svg viewBox="0 0 24 24"><path d="${n[3]}"/></svg>${L(n[1],n[2])}</button>`).join('');
  $('#v-'+TAB).classList.add('on');
  const now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());$('#f-date').value=now.toISOString().slice(0,16);
  $('#s-lang').value=S.lang;$('#s-auto').value=S.auto||'';fillSel();aiUI();autoSes();durUI();rrUI();lcUI();editBar();storeUI();
}

/* Events */
document.addEventListener('click',e=>{
  const op=e.target.closest('[data-open]');if(op&&!e.target.closest('button,select')){detail(op.dataset.open);return}
  const b=e.target.closest('button');if(!b)return;const d=b.dataset,id=b.id;
  if(d.v)gotoTab(d.v);
  if(d.close)closeOv();if(d.edit)editTrade(d.edit);if(d.delx){delTrade(d.delx);closeOv()}if(d.more){LP+=50;listRes()}
  if(d.del)delTrade(d.del);
  if(d.pbdel!=null){PB.splice(+d.pbdel,1);save();render()}
  if(d.dopen){DD=d.dopen;diary();scrollTo(0,0)}
  if(d.ddel){delete D[d.ddel];save();diary()}
  if(id==='pm'){cm=new Date(cm.getFullYear(),cm.getMonth()-1,1);calendar()}
  if(id==='nm'){cm=new Date(cm.getFullYear(),cm.getMonth()+1,1);calendar()}
  if(id==='pbadd'){const n=$('#pb-n').value.trim();if(n){PB.push({name:n,rules:$('#pb-r').value,entry:$('#pb-e').value});save();render()}}
  if(id==='d-save'){DD=$('#d-date').value||DD;D[DD]={mood:$('#d-mood').value,rate:$('#d-rate').value,view:$('#d-view').value,good:$('#d-good').value,bad:$('#d-bad').value,less:$('#d-less').value,plan:$('#d-plan').value};save();diary();$('#d-msg').textContent=L('Diary save ho gayi.','Diary saved.')}
  if(d.a==='ai4')aitag();
  if(d.a==='ai3'){const q=$('#ai-q').value.trim();if(q)ask(q)}if(d.a==='mic')micAsk();if(d.a==='micnote')micNote();if(d.a==='aiclr'){CH=[];$('#ai-out').textContent=''}if(d.a==='nq'){QI=nextQ();dash()}
  if(d.a==='ai1'||d.a==='ai2'){const a=realS();if(!a.length){$('#ai-out').textContent=L('Pehle kuch trades daalo.','Add some trades first.');return}
    if(d.a==='ai1')ai('Review the very last trade (last line of the list): what was done well, what mistake happened, and one improvement in the context of earlier trades.',brief(a.slice(-15)));
    if(d.a==='ai2'){const w=new Date();w.setDate(w.getDate()-7);const x=a.filter(t=>day(t)>=ld(w));ai('Write the weekly report for the last 7 days: strengths, weaknesses, costliest mistake, overtrading or rule-break behaviour, and 3 action points for next week.',brief(x.length?x:a.slice(-20)))}
  }
  if(id==='save')saveTrade();
  if(id==='ecancel'){EDIT=null;buildUI();render()}
  if(id==='shot-rm'){SHOT=null;SHOTRM=true;$('#shot-prev').textContent='';$('#f-shot').value=''}
  if(id==='csv')csvOut();if(id==='purge')purge();
    if(id==='lc')calcLot();
  if(id==='imp-go')doImport($('#imp-text').value);
  if(id==='exp')exportBk();
  if(id==='bk-copy'){const ta=$('#bk-text');ta.style.display='';if(!ta.value)ta.value=bkData();ta.select&&ta.select();try{navigator.clipboard.writeText(ta.value)}catch(x){}$('#bmsg').textContent=L('Copy ho gaya. Kisi note ya chat mein save kar lo.','Copied. Save it somewhere safe.')}
  if(id==='bk-rest'){$('#bmsg').textContent=restore($('#bk-text').value)?L('Restore ho gaya.','Restored.'):L('Backup text sahi nahi hai.','Invalid backup text.')}
  if(id==='clr'){if(confirm(L('Saara data (trades, diary aur screenshots) delete karna hai?','Delete all data (trades, diary and screenshots)?'))){T=[];D={};shotClear().catch(()=>{});save();render()}}
  if(id==='th'){const th=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=th;try{localStorage.setItem('gj_th',th)}catch(x){}}
  if(id==='lang'){S.lang=S.lang==='en'?'hi':'en';save();buildUI();render()}
});
document.addEventListener('change',e=>{const t=e.target,id=t.id,d=t.dataset||{};
  if(d.mis){const x=T.find(y=>y.id===d.mis);if(x){x.mis=t.value;save();render()}}
  if(d.s){const v=+t.value||0;if(d.s==='lim')LIM=v;else S[d.s]=v;save();render()}
  if(id==='d-date'){DD=t.value||DD;diary()}
  if(id==='pf'){FS=t.value;render()}
  if(id==='s-lang'){S.lang=t.value;save();buildUI();render()}
  if(id==='s-ai'){S.ai=t.value;save();aiUI();calendar()}
  if(id==='s-key'){S.keys[S.ai]=t.value.trim();save();calendar()}
  if(id==='s-mdl'){if(t.value==='__c'){$('#s-cm').style.display='';$('#s-cm').focus()}else{S.mdl[S.ai]=t.value;$('#s-cm').style.display='none';save()}}
  if(id==='s-cm'){const v=t.value.trim();if(v){S.mdl[S.ai]=v;save()}}
  if(id==='s-auto'){S.auto=t.value;save()}
  if(id==='s-lang_'){}
  if(id==='ai-ctx'){S.aictx=t.value;save()}
  if(id==='lf-f'){LF=t.value;LP=50;listRes()}
  if(id==='l-mode'||id==='l-sym')lcUI();
  if(id==='f-shot'&&t.files&&t.files[0])shotPick(t.files[0]);
  if(id==='imp'&&t.files[0])t.files[0].arrayBuffer().then(b=>doImport(dec(b)));
  if(id==='rst'&&t.files[0])t.files[0].arrayBuffer().then(b=>{$('#bmsg').textContent=restore(dec(b))?L('Restore ho gaya.','Restored.'):L('File sahi nahi hai.','Invalid file.')});
  if(id&&id.startsWith('f-'))formUI(id);
});
document.addEventListener('input',e=>{const id=e.target.id;if(id&&id.startsWith('f-'))formUI(id);if(id==='lf-q'){LQ=e.target.value;LP=50;listRes()}});
function formUI(id){if(id==='f-date'){autoSes();durUI()}if(id==='f-cdate')durUI();if(['f-sym','f-dir','f-entry','f-sl','f-tp','f-exit','f-lots'].includes(id))rrUI()}

async function saveTrade(){
  const g=id=>$('#'+id).value,n=id=>parseFloat(g(id)),m=$('#msg');
  const sym=g('f-sym'),en=n('f-entry'),ex=n('f-exit'),lots=n('f-lots'),sl=n('f-sl'),tp=n('f-tp'),fee=Math.abs(n('f-fee')||0),dir=g('f-dir'),ov=n('f-pl'),od=g('f-date'),cd=g('f-cdate');
  if(!od||isNaN(en)||isNaN(ex)||!(lots>0)){m.textContent=L('Open time, entry, exit aur lots bharna zaroori hai.','Open time, entry, exit and lots are required.');return}
  if(cd&&new Date(cd)<new Date(od)){m.textContent=L('Close time open time se pehle nahi ho sakta.','Close time cannot be before open time.');return}
  const old=EDIT?T.find(x=>x.id===EDIT):null,gd=guard(),s=dir==='buy'?1:-1,gross=(ex-en)*s*lots*pv(sym,ex),base=isNaN(ov)?gross:ov,pnl=isNaN(ov)?gross-fee:ov;
  const rk=!isNaN(sl)&&sl!==en?Math.abs(en-sl)*lots*pv(sym,en):0,chk=['c1','c2','c3'].filter(c=>$('#'+c).checked).length;
  const rec={id:old?old.id:Date.now()+''+Math.random().toString(36).slice(2,5),date:od,cdate:cd||null,sym,dir,lots,entry:en,sl:isNaN(sl)?null:sl,tp:isNaN(tp)?null:tp,exit:ex,fee,pnl,r:rk>0?base/rk:null,ses:g('f-ses'),tag:g('f-tag'),mis:g('f-mis'),mood:g('f-mood'),news:g('f-news'),grade:g('f-grade'),chk,note:g('f-note'),ov:isNaN(ov)?0:1,imp:old?old.imp:0,shot:old?old.shot:0,ot:old?old.ot:(gd.block&&od.slice(0,10)===today()?1:0)};
  let sm='';
  try{if(SHOT){await shotPut(rec.id,SHOT);rec.shot=1}else if(SHOTRM&&rec.shot){await shotDel(rec.id);rec.shot=0}}catch(e){sm=L(' (Screenshot save nahi hua)',' (screenshot could not be saved)')}
  if(old)T[T.indexOf(old)]=rec;else T.push(rec);
  if(!old){const l2=T.filter(x=>day(x)===today()&&!x.sum).sort(byDate).slice(-2);if(S.cd>0&&l2.length===2&&l2.every(x=>x.pnl<0))S.cool=Date.now()+S.cd*60000}
  const wasEdit=!!old;save();SHOT=null;SHOTRM=false;
  if(wasEdit){EDIT=null;buildUI();render();$('#msg').textContent=L('Trade update ho gaya.','Trade updated.')+sm;return}
  render();m.textContent=L('Trade save ho gaya.','Trade saved.')+sm;if(S.auto)autoRev();
  ['c1','c2','c3'].forEach(c=>$('#'+c).checked=false);$('#f-note').value='';$('#f-pl').value='';$('#f-cdate').value='';$('#f-tp').value='';$('#f-shot').value='';$('#shot-prev').textContent='';durUI();rrUI();
}

let th='dark';try{th=localStorage.getItem('gj_th')||'dark'}catch(e){}
document.documentElement.dataset.theme=th;
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
buildUI();render();
setInterval(()=>{if(TAB==='dash'||TAB==='add'){dash();addGuard()}},30000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!window.Capacitor)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
